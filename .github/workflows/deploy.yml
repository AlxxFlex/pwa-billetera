name: Publicar Mi Billetera Lite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Verificar y preparar
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Ejecutar pruebas
        run: npm test
      - name: Preparar archivos estáticos
        run: npm run build
      - name: Configurar GitHub Pages
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/configure-pages@v5
      - name: Subir sitio
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publicar con HTTPS
    if: vars.ENABLE_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
